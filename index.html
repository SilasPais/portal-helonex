
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HELONEX - Inteligência Logística Soberana</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Oswald', 'sans-serif'] },
            colors: { hlx: { navy: '#0f172a', gold: '#f59e0b', blue: '#1e40af', orange: '#f97316' } }
          }
        }
      }
    </script>
    
    <style>
      body { background-color: #0f172a; color: white; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
      #root { min-height: 100vh; }
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0f172a;
      }
      .loader {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(245, 158, 11, 0.1);
        border-radius: 50%;
        border-top: 4px solid #f59e0b;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .brand-text { font-family: 'Oswald', sans-serif; margin-top: 24px; color: white; letter-spacing: 4px; font-size: 32px; font-weight: bold; text-transform: uppercase; }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0",
    "recharts": "https://esm.sh/recharts@2.12.2",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>

    <!-- SDK Gemini Global via ESM.RUN (Injetado antes do app para garantir disponibilidade) -->
    <script type="module">
      import { GoogleGenAI } from "https://esm.run/@google/genai";
      window.GoogleGenAI = GoogleGenAI;
    </script>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <div class="loader"></div>
        <h2 class="brand-text">HELO<span style="color: #f59e0b;">NEX</span></h2>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
